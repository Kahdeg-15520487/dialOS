name: .NET Runtime + GUI

on:
  push:
    branches: [master]
    paths:
      - 'dotnet/**'
      - 'tests/e2e/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [master]
    paths:
      - 'dotnet/**'
      - 'tests/e2e/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build dotnet/DialOS.sln -c Release

      - name: Test (unit + E2E conformance)
        run: dotnet test dotnet/DialOS.sln -c Release --no-build --logger "console;verbosity=normal"
